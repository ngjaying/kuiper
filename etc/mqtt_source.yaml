#Global MQTT configurations
default:
  qos: 1
  server: "tcp://127.0.0.1:1883"

canmsg:
  payloadField: packet
  payloadFormat: canpacket
  payloadSchemaId: scene/dbc

canmsg_batch_merge:
  interval: 1s
  payloadFormat: canpacket
  payloadSchemaId: scene/dbc
  merger: canmsg

canjson:
  payloadBatchField: frames
  payloadField: data
  payloadFormat: can
  payloadSchemaId: scene/dbc

ten_sec:
  interval: 10s
  payloadFormat: can
  payloadSchemaId: scene/dbc
  merger: jsoncan

batch:
  interval: 10s

batchMerge:
  interval: 10s
  mergeField: id