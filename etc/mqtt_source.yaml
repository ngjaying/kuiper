#Global MQTT configurations
default:
  qos: 1
  server: "tcp://127.0.0.1:1883"

canjson:
  payloadBatchField: frames
  payloadField: data
  payloadFormat: can
  payloadSchemaId: scene/dbc

ten_sec:
  interval: 10s
  payloadFormat: can
  payloadSchemaId: scene/dbc
  merger: jsoncan

batch:
  interval: 10s

batchMerge:
  interval: 10s
  mergeField: id