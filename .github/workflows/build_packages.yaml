name: Build packages

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      # Use the Debian Bullseye base image for glibc compatibility
      image: debian:bullseye

    strategy:
      matrix:
        golang:
          - 1.25.4
        target:
          - { "goos": "linux", "goarch": "amd64", "cc": "gcc" }
          - { "goos": "linux", "goarch": "arm64", "cc": "aarch64-linux-gnu-gcc" }
          - { "goos": "linux", "goarch": "arm", "goarm": "7", "cc": "arm-linux-gnueabihf-gcc" }

    steps:
      - name: Install essential build tools and cross-compilation toolchains
        run: |
          apt-get update
          apt-get install -y git curl make rsync jq ca-certificates build-essential
          if [ "${{ matrix.target.goarch }}" = "arm64" ]; then
            apt-get install -y gcc-aarch64-linux-gnu
          elif [ "${{ matrix.target.goarch }}" = "arm" ]; then
            apt-get install -y gcc-arm-linux-gnueabihf
          fi
          
          GO_VERSION="1.25.4"
          GO_URL="https://golang.org/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          
          curl -fvL -o go.tar.gz "$GO_URL"
          tar -C /usr/local -xzf go.tar.gz
          rm go.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          export PATH=/usr/local/go/bin:$PATH
          go version

      - uses: actions/create-github-app-token@v1
        id: generate-token
        with:
          app-id: ${{ vars.AUTH_APP_ID }}
          private-key: ${{ secrets.AUTH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            lfek
            ekuiper_can
            can
            sdv-tools
            arxml-converter
            idl-parser

      - name: Configure Go environment
        run: |
          git config --global url."https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/emqx/*

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build binary packages
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          GOARM: ${{ matrix.target.goarm }}
          CC: ${{ matrix.target.cc }}
          CGO_ENABLED: 1
          KUIPER_SOURCE: ${{ github.workspace }}
          REF: ${{ github.ref_name }}
        run: |
          make pkg_ex VERSION=${REF}
          make pkg_sdv VERSION=${REF}
          make build_deadlock_ex VERSION=${REF}
          make build_deadlock_sdv VERSION=${REF}

      - name: Create sha file
        run: |
          cd _packages && for var in $(ls); do bash -c "echo $(sha256sum $var | awk '{print $1}') > $var.sha256"; done && cd -

      - name: Set artifact name
        id: artifact_name
        shell: bash
        env:
          GOARCH: ${{ matrix.target.goarch }}
          GOARM: ${{ matrix.target.goarm }}
          REF: ${{ github.ref_name }}
        run: |
          arch=$GOARCH
          if [ "$GOARCH" = "arm" ] && [ -n "$GOARM" ]; then
            arch="${GOARCH}v${GOARM}"
          fi
          ref=$(echo ${REF/\//-})
          artifact_name="kuiper-${ref}-linux-${arch}"
          echo "artifact_name=$artifact_name" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.artifact_name }}
          path: _packages/

  release:
    runs-on: ubuntu-24.04

    needs:
      - build

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kuiper-*
          path: _packages
          merge-multiple: true
      - name: check packages
        run: |
          cd _packages && for var in $( ls |grep -v sha256); do
            echo "$(cat $var.sha256) $var" | sha256sum -c || exit 1
          done
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: "_packages/kuiper*"
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: "*"