name: Build packages

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        golang:
          - 1.24.5
        target:
          - { "goos": "linux", "goarch": "amd64", "cc": "gcc" }
          - { "goos": "linux", "goarch": "arm64", "cc": "aarch64-linux-gnu-gcc" }
          - { "goos": "linux", "goarch": "arm", "goarm": "7", "cc": "arm-linux-gnueabihf-gcc" }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.golang }}

      - name: Install cross-compilation toolchains
        run: |
          sudo apt-get update
          if [ "${{ matrix.target.goarch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          elif [ "${{ matrix.target.goarch }}" = "arm" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf
          fi
          # Install any additional dependencies your project needs
          sudo apt-get install -y rsync

      - uses: actions/create-github-app-token@v1
        id: generate-token
        with:
          app-id: ${{ vars.AUTH_APP_ID }}
          private-key: ${{ secrets.AUTH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            lfek
            ekuiper_can
            can
            sdv-tools

      - name: Configure Go environment
        run: |
          git config --global url."https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/emqx/*

      - name: Build binary packages
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          GOARM: ${{ matrix.target.goarm }}
          CC: ${{ matrix.target.cc }}
          CGO_ENABLED: 1
          KUIPER_SOURCE: ${{ github.workspace }}
        run: |
          # Set additional environment variables for cross-compilation if needed
          if [ "${{ matrix.target.goarch }}" = "arm64" ]; then
            export CC_FOR_TARGET=aarch64-linux-gnu-gcc
            export CXX_FOR_TARGET=aarch64-linux-gnu-g++
          elif [ "${{ matrix.target.goarch }}" = "arm" ]; then
            export CC_FOR_TARGET=arm-linux-gnueabihf-gcc
            export CXX_FOR_TARGET=arm-linux-gnueabihf-g++
          fi
          
          # Run your build commands
          make pkg_ex
          make pkg_sdv

      - name: create sha file
        run: |
          cd _packages && for var in $(ls); do sudo bash -c "echo $(sha256sum $var | awk '{print $1}') > $var.sha256"; done && cd -

      - name: Set artifact name
        id: artifact_name
        env:
          GOARCH: ${{ matrix.target.goarch }}
          GOARM: ${{ matrix.target.goarm }}
          REF: ${{ github.ref_name }}
        run: |
          arch=$GOARCH
          if [ "$GOARCH" = "arm" ] && [ -n "$GOARM" ]; then
            arch="${GOARCH}v${GOARM}"
          fi
          ref=$(echo ${REF/\//-})
          artifact_name="kuiper-${ref}-linux-${arch}"
          echo "artifact_name=$artifact_name" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.artifact_name }}
          path: _packages/

  release:
    runs-on: ubuntu-24.04

    needs:
      - build

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kuiper-*
          path: _packages
          merge-multiple: true
      - name: check packages
        run: |
          cd _packages && for var in $( ls |grep -v sha256); do
            echo "$(cat $var.sha256) $var" | sha256sum -c || exit 1
          done
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: "_packages/kuiper*"
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: "*"