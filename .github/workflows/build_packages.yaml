name: Build packages

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  release:
    types:
      - published

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      arch: ${{ steps.arch.outputs.arch }}

    steps:
      - id: arch
        run: |
          if ${{ contains(fromJSON('["release", "workflow_dispatch"]'), github.event_name) }}; then
            echo "arch=[\"linux/amd64\", \"linux/arm64\", \"linux/arm/v7\"]" >> $GITHUB_OUTPUT
          else
            echo "arch=[\"linux/amd64\"]" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-latest
    needs: prepare

    strategy:
      matrix:
        golang:
          - 1.23.1
        arch: ${{fromJson(needs.prepare.outputs.arch)}}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build binary packages
        run: |
          docker run -i --rm \
          -v $(pwd):/ekuiper \
          --workdir /ekuiper \
          --env KUIPER_SOURCE='/ekuiper' \
          --platform ${{ matrix.arch }} \
          ghcr.io/lf-edge/ekuiper/base:${{ matrix.golang }}-debian \
          bash -euc "apt-get update && apt-get install -y rsync && git config --global url."https://${{ secrets.CI_GIT_TOKEN }}:x-oauth-basic@github.com/emqx".insteadOf "https://github.com/emqx" && git config --global --add safe.directory /ekuiper && make pkg_ex && make pkg_sdv && make pkg_gee"
      - name: create sha file
        run: |
          cd _packages && for var in $(ls); do sudo bash -c "echo $(sha256sum $var | awk '{print $1}') > $var.sha256"; done && cd -
      - name: Set artifact name
        id: artifact_name
        env:
          ARCH: ${{ matrix.arch }}
          REF: ${{ github.ref_name }}
        run: |
          arch=$(echo $ARCH | sed -r 's|linux/([a-z]*)(/.*)*|\1|g')
          ref=$(echo ${REF/\//-})
          artifact_name="kuiper-${ref}-${{ matrix.os }}-${arch}"
          echo "artifact_name=$artifact_name" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.artifact_name }}
          path: _packages/

  release:
    runs-on: ubuntu-latest

    needs:
      - build

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kuiper-*
          path: _packages
          merge-multiple: true
      - name: check packages
        run: |
          cd _packages && for var in $( ls |grep -v sha256); do
            echo "$(cat $var.sha256) $var" | sha256sum -c || exit 1
          done
      - uses: Rory-Z/upload-release-asset@v1
        if: github.event_name == 'release'
        with:
          repo: ekuiper
          path: "_packages/kuiper*"
          token: ${{ secrets.CI_GIT_TOKEN }}
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: "*"
