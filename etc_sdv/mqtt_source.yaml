#Global MQTT configurations
default:
  qos: 1
  server: "tcp://127.0.0.1:1883"

gbf_1000ms:
  interval: 1s
  payloadFormat: gbf
  merger: gbf

gbf_200ms:
  interval: 200ms
  payloadFormat: gbf
  merger: gbf

canjson:
  payloadBatchField: frames
  payloadField: data
  payloadFormat: can
  payloadSchemaId: dbc/test

ten_sec:
  interval: 10s
  payloadFormat: can
  payloadSchemaId: dbc/test
  merger: jsoncan

batch:
  interval: 10s

batchMerge:
  interval: 10s
  mergeField: id